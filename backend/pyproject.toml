[project]
name = "portfolio-tracker-api"
version = "0.1.0"
description = "Stateless FastAPI backend for the React portfolio tracker"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pandas>=2.0",
    "yfinance>=0.2.50",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
