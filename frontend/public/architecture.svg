<text x="1058" y="433" font-size="12" fill="#5F6368">Cloudflare Pages (free)</text>
<text x="1058" y="452" font-size="12" fill="#5F6368">Static React build</text>
<text x="1058" y="471" font-size="12" fill="#5F6368">*.pages.dev public URL</text>

<g filter="url(#sh)"><rect x="1040" y="520" width="220" height="118" rx="10" fill="#FFFFFF" stroke="#E3E1DA"/><rect x="1040" y="528" width="4" height="102" rx="2" fill="#5E35B1"/></g>
<text x="1058" y="544" font-size="13.5" font-weight="700" fill="#1B1B1F">Backend</text>
<text x="1058" y="563" font-size="12" fill="#5F6368">Render free web service</text>
<text x="1058" y="582" font-size="12" fill="#5F6368">FastAPI, one worker, 512 MB</text>
<text x="1058" y="601" font-size="12" fill="#5F6368">Sleeps after 15 min idle,</text>
<text x="1058" y="620" font-size="12" fill="#5F6368">about 1 min to wake</text>

<g filter="url(#sh)"><rect x="1040" y="662" width="220" height="100" rx="10" fill="#FFFFFF" stroke="#E3E1DA"/><rect x="1040" y="670" width="4" height="84" rx="2" fill="#5E35B1"/></g>
<text x="1058" y="686" font-size="13.5" font-weight="700" fill="#1B1B1F">Wiring</text>
<text x="1058" y="705" font-size="12" fill="#5F6368">Frontend reads VITE_API_URL</text>
<text x="1058" y="724" font-size="12" fill="#5F6368">Backend CORS allows the</text>
<text x="1058" y="743" font-size="12" fill="#5F6368">frontend origin only</text>

<path d="M1150,490 V520" fill="none" stroke="#5E35B1" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ahp)"/>
<rect x="1160.1" y="494" width="69.8" height="22" rx="6" fill="#FBFAF7" stroke="#E3E1DA"/>
<text x="1195" y="508" font-size="11" text-anchor="middle" fill="#5E35B1">calls API</text>

<!-- Request flow -->
<rect x="20" y="830" width="1260" height="72" rx="12" fill="#FFFFFF" stroke="#E3E1DA" filter="url(#sh)"/>
<text x="40" y="855" font-size="12.5" font-weight="700" fill="#1B1B1F">Request flow</text>
<text x="40" y="874" font-size="12" fill="#5F6368">1  Pick the sample, upload a CSV or add a row   →   2  POST /validate; clean rows kept in React state   →   3  Tabs POST them to /portfolio and /performance</text>
<text x="40" y="892" font-size="12" fill="#5F6368">4  Backend re-validates, gets prices (cache → Yahoo → snapshot), computes holdings, XIRR and trend   →   5  JSON back; React renders donut, tables, metrics and chart</text>
</svg>
