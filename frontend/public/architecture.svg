<text x="58" y="433" font-size="12" fill="#5F6368">Held in React state only · cleared on refresh</text>
<text x="58" y="452" font-size="12" fill="#5F6368">No account, no database, nothing saved</text>

<g filter="url(#sh)"><rect x="40" y="499" width="340" height="85" rx="10" fill="#FFFFFF" stroke="#E3E1DA"/><rect x="40" y="507" width="4" height="69" rx="2" fill="#3D5AFE"/></g>
