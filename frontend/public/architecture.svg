<g filter="url(#sh)"><rect x="1040" y="390" width="220" height="100" rx="10" fill="#FFFFFF" stroke="#E3E1DA"/><rect x="1040" y="398" width="4" height="84" rx="2" fill="#5E35B1"/></g>
