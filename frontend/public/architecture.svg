<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 920" width="1300" height="920" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Portfolio Tracker: React + FastAPI architecture</title>
<desc>Browser (React) sends transactions over HTTPS and JSON to a stateless FastAPI backend, which validates them, computes holdings, totals, XIRR and value history, and gets prices from a cache, then Yahoo Finance, then a stored snapshot. Frontend on Cloudflare Pages, backend on Render.</desc>
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B1B1F" flood-opacity="0.10"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/></marker>
<marker id="ahp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5E35B1"/></marker>
<marker id="ahu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D5AFE"/></marker>
</defs>
<rect width="1300" height="920" fill="#FBFAF7"/>
<text x="30" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1B1B1F">Portfolio Tracker: React + FastAPI architecture</text>
<text x="30" y="66" font-size="13" fill="#5F6368">React frontend, stateless FastAPI backend, prices from Yahoo Finance. The browser sends its transactions with each request; the server stores nothing.</text>

<!-- Zones -->
<rect x="20" y="90" width="380" height="722" rx="16" fill="#EEF3FF" stroke="#3D5AFE" stroke-opacity="0.45" stroke-width="1.5"/>
<text x="38" y="118" font-size="12" font-weight="700" letter-spacing="1.4" fill="#3D5AFE">BROWSER  ·  REACT + VITE + TYPESCRIPT</text>
<rect x="500" y="90" width="420" height="722" rx="16" fill="#EAF6EE" stroke="#2E7D32" stroke-opacity="0.45" stroke-width="1.5"/>
<text x="518" y="118" font-size="12" font-weight="700" letter-spacing="1.4" fill="#2E7D32">BACKEND  ·  PYTHON + FASTAPI</text>
<rect x="1020" y="90" width="260" height="200" rx="16" fill="#FFF5DD" stroke="#B8860B" stroke-opacity="0.45" stroke-width="1.5"/>
<text x="1038" y="118" font-size="12" font-weight="700" letter-spacing="1.4" fill="#B8860B">EXTERNAL</text>
<rect x="1020" y="330" width="260" height="482" rx="16" fill="#F2ECFC" stroke="#5E35B1" stroke-opacity="0.45" stroke-width="1.5"/>
<text x="1038" y="356" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5E35B1">HOSTING  ·</text>
<text x="1038" y="372" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5E35B1">CLOUDFLARE PAGES + RENDER</text>

<!-- Browser -->
<g filter="url(#sh)"><rect x="40" y="130" width="340" height="112" rx="10" fill="#FFFFFF" stroke="#E3E1DA"/><rect x="40" y="138" width="4" height="96" rx="2" fill="#3D5AFE"/></g>
<text x="58" y="154" font-size="13.5" font-weight="700" fill="#1B1B1F">App shell: four tabs</text>
<text x="58" y="173" font-size="12" fill="#5F6368">Input Transactions</text>
<text x="58" y="192" font-size="12" fill="#5F6368">Current Portfolio</text>
<text x="58" y="211" font-size="12" fill="#5F6368">Historical Performance</text>
<text x="58" y="230" font-size="12" fill="#5F6368">Architecture (this explainer)</text>

<g filter="url(#sh)"><rect x="40" y="262" width="340" height="104" rx="10" fill="#FFFFFF" stroke="#E3E1DA"/><rect x="40" y="270" width="4" height="88" rx="2" fill="#3D5AFE"/></g>
<text x="58" y="286" font-size="13.5" font-weight="700" fill="#1B1B1F">Input forms</text>
<text x="58" y="305" font-size="12" fill="#5F6368">☑ Use the sample portfolio (default)</text>
<text x="58" y="324" font-size="12" fill="#5F6368">CSV upload (drag and drop)</text>
<text x="58" y="343" font-size="12" fill="#5F6368">Manual entry form · Download sample CSV</text>

<g filter="url(#sh)"><rect x="40" y="390" width="340" height="85" rx="10" fill="#FFFFFF" stroke="#E3E1DA"/><rect x="40" y="398" width="4" height="69" rx="2" fill="#3D5AFE"/></g>
