<text x="450" y="430" font-size="11" text-anchor="middle" fill="#3D5AFE">transactions in,</text>
<text x="450" y="446" font-size="11" text-anchor="middle" fill="#3D5AFE">results out</text>

<!-- Backend -->
<g filter="url(#sh)"><rect x="520" y="130" width="380" height="104" rx="10" fill="#FFFFFF" stroke="#E3E1DA"/><rect x="520" y="138" width="4" height="88" rx="2" fill="#2E7D32"/></g>
<text x="538" y="154" font-size="13.5" font-weight="700" fill="#1B1B1F">FastAPI app <tspan font-size="11" font-weight="400" fill="#80868B">· app/main.py, limits.py</tspan></text>
<text x="538" y="173" font-size="12" fill="#5F6368">CORS allow-list · request validation · JSON errors</text>
<text x="538" y="192" font-size="12" fill="#5F6368">Limits: 2 MB · 5,000 rows · 25 tickers</text>
<text x="538" y="211" font-size="12" fill="#5F6368">Per-IP rate limit · timeouts · no body logging</text>

<g filter="url(#sh)"><rect x="520" y="250" width="380" height="125" rx="10" fill="#FFFFFF" stroke="#E3E1DA"/><rect x="520" y="258" width="4" height="109" rx="2" fill="#2E7D32"/></g>
<text x="538" y="274" font-size="13.5" font-weight="700" fill="#1B1B1F">Endpoints <tspan font-size="11" font-weight="400" fill="#80868B">· app/routes/</tspan></text>
<text x="538" y="293" font-size="12" fill="#5F6368">GET  /health</text>
<text x="538" y="312" font-size="12" fill="#5F6368">POST /api/transactions/validate</text>
<text x="538" y="331" font-size="12" fill="#5F6368">POST /api/portfolio</text>
<text x="538" y="350" font-size="12" fill="#5F6368">POST /api/performance</text>

<g filter="url(#sh)"><rect x="520" y="392" width="380" height="66" rx="10" fill="#FFFFFF" stroke="#E3E1DA"/><rect x="520" y="400" width="4" height="50" rx="2" fill="#2E7D32"/></g>
<text x="538" y="416" font-size="13.5" font-weight="700" fill="#1B1B1F">Validation <tspan font-size="11" font-weight="400" fill="#80868B">· core/transactions.py</tspan></text>
<text x="538" y="435" font-size="12" fill="#5F6368">Parse CSV · normalize · reject bad rows · oversell check</text>

<g filter="url(#sh)"><rect x="520" y="474" width="380" height="66" rx="10" fill="#FFFFFF" stroke="#E3E1DA"/><rect x="520" y="482" width="4" height="50" rx="2" fill="#2E7D32"/></g>
<text x="538" y="498" font-size="13.5" font-weight="700" fill="#1B1B1F">Accounting &amp; XIRR <tspan font-size="11" font-weight="400" fill="#80868B">· core/accounting.py, xirr.py</tspan></text>
<text x="538" y="517" font-size="12" fill="#5F6368">Holdings (avg cost) · totals · total return · XIRR</text>

<g filter="url(#sh)"><rect x="520" y="556" width="380" height="62" rx="10" fill="#FFFFFF" stroke="#E3E1DA"/><rect x="520" y="564" width="4" height="46" rx="2" fill="#2E7D32"/></g>
<text x="538" y="580" font-size="13.5" font-weight="700" fill="#1B1B1F">Value history <tspan font-size="11" font-weight="400" fill="#80868B">· core/history.py</tspan></text>
<text x="538" y="599" font-size="12" fill="#5F6368">Portfolio value and net invested over time</text>

<g filter="url(#sh)"><rect x="520" y="634" width="380" height="66" rx="10" fill="#FFFFFF" stroke="#E3E1DA"/><rect x="520" y="642" width="4" height="50" rx="2" fill="#2E7D32"/></g>
<text x="538" y="658" font-size="13.5" font-weight="700" fill="#1B1B1F">Price cache <tspan font-size="11" font-weight="400" fill="#80868B">· pricing/cache.py</tspan></text>
<text x="538" y="677" font-size="12" fill="#5F6368">Per-ticker TTL · shared fetches · bad-ticker memory</text>

<g filter="url(#sh)"><rect x="520" y="716" width="380" height="84" rx="10" fill="#FFFFFF" stroke="#E3E1DA"/><rect x="520" y="724" width="4" height="68" rx="2" fill="#2E7D32"/></g>
<text x="538" y="740" font-size="13.5" font-weight="700" fill="#1B1B1F">Prices + snapshot fallback <tspan font-size="11" font-weight="400" fill="#80868B">· pricing/service.py</tspan></text>
<text x="538" y="759" font-size="12" fill="#5F6368">Live: yfinance, else price_snapshot.json</text>
<text x="538" y="778" font-size="12" fill="#5F6368">labelled "Prices as of &lt;date&gt;" · test fakes offline</text>

